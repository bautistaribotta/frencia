<!-- @dsCard group="Colors" viewport="1440x900" name="Verde de acción — claro vs oscuro" subtitle="Vista partida: #22C55E en ambos temas — prueba del verde del oscuro sobre claro" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Frencia · Verde en ambos temas</title>
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:#8E948E;font-family:var(--font-sans);padding:36px;display:flex;gap:28px;align-items:stretch}
.pane{flex:1;border-radius:22px;padding:30px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px;background:var(--bg-app);color:var(--text-primary)}
.tag{display:block;white-space:nowrap;font:var(--text-data-label);letter-spacing:var(--ls-wider);text-transform:uppercase;color:var(--text-tertiary)}
h2{font-family:var(--font-display);font-weight:var(--fw-regular);text-transform:uppercase;letter-spacing:var(--ls-display);font-size:34px;line-height:1;margin:0}
.card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:22px;display:flex;flex-direction:column;gap:16px}
.cta{display:flex;align-items:center;justify-content:center;gap:9px;background-color:var(--accent);color:var(--text-on-accent);border:none;border-radius:var(--radius-md);padding:16px 20px;font:var(--fw-bold) 16px var(--font-sans);box-shadow:var(--glow-green-soft);cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface-green-soft);border:1px solid var(--surface-green-line);color:var(--accent-text);border-radius:999px;padding:7px 13px;font:var(--fw-semibold) 12.5px var(--font-sans)}
.ghost{background:transparent;border:1.5px solid var(--border-default);color:var(--text-primary);border-radius:var(--radius-md);padding:14px 18px;font:var(--fw-semibold) 15px var(--font-sans)}
.track{height:10px;border-radius:999px;background:var(--data-track);overflow:hidden}
.fill{display:block;height:100%;width:64%;background-color:var(--data-volume);border-radius:999px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat b{font-family:var(--font-display);font-weight:var(--fw-regular);font-size:42px;line-height:.9;color:var(--accent-text)}
.stat span{font:var(--text-data-label);letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--text-tertiary)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
/* Prueba: el verde del tema oscuro (#22C55E) aplicado al panel claro */
.pane.test-green{--accent:#22C55E;--accent-press:#16A34A;--accent-text:#15803D;--data-volume:#22C55E;--text-on-accent:var(--ink-1000);--surface-green-soft:rgba(34,197,94,0.12);--surface-green-line:rgba(34,197,94,0.34)}
.sw{border-radius:14px;overflow:hidden;border:1px solid var(--border-subtle);background:var(--surface-card)}
.sw i{display:block;height:52px}
.sw em{display:block;padding:8px 10px;font:10px var(--font-mono);font-style:normal;color:var(--text-tertiary);white-space:nowrap}
</style>
</head>
<body>

<section class="pane" data-theme="dark">
  <div><span class="tag">Tema oscuro</span><h2>Verde de acción</h2></div>
  <div class="card">
    <div class="stat"><b>12 480 kg</b><span>Volumen semanal</span></div>
    <div class="track"><i class="fill"></i></div>
    <div class="row"><span class="chip">PR nuevo</span><span class="chip">Serie completa</span></div>
    <button class="cta">Empezar entrenamiento</button>
    <button class="ghost">Ver rutina</button>
  </div>
  <div class="swatches">
    <div class="sw"><i style="background:var(--accent)"></i><em>accent · #22C55E</em></div>
    <div class="sw"><i style="background:var(--accent-press)"></i><em>press · #16A34A</em></div>
    <div class="sw"><i style="background:var(--surface-green-soft)"></i><em>wash · 10%</em></div>
  </div>
</section>

<section class="pane test-green" data-theme="light">
  <div><span class="tag">Tema claro · verde del oscuro</span><h2>Verde de acción</h2></div>
  <div class="card">
    <div class="stat"><b>12 480 kg</b><span>Volumen semanal</span></div>
    <div class="track"><i class="fill"></i></div>
    <div class="row"><span class="chip">PR nuevo</span><span class="chip">Serie completa</span></div>
    <button class="cta">Empezar entrenamiento</button>
    <button class="ghost">Ver rutina</button>
  </div>
  <div class="swatches">
    <div class="sw"><i style="background:var(--accent)"></i><em>accent · #22C55E</em></div>
    <div class="sw"><i style="background:var(--accent-press)"></i><em>press · #16A34A</em></div>
    <div class="sw"><i style="background:var(--surface-green-soft)"></i><em>wash · 12%</em></div>
  </div>
</section>

</body>
</html>
