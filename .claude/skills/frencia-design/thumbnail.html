<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Frencia — thumbnail</title>
<link rel="stylesheet" href="./styles.css">
<style>
html,body{margin:0;padding:0}
body{width:1280px;height:854px;display:flex;overflow:hidden}
.mark{flex:1;background:var(--ink-900);display:grid;place-items:center;padding:0 40px}
.mark span{font-family:var(--font-display);font-weight:var(--fw-regular);font-size:184px;line-height:.88;letter-spacing:.01em;text-transform:uppercase;color:var(--ink-0);white-space:nowrap}
.strip{width:25%;display:flex;flex-direction:column}
.strip i{flex:1}
</style>
</head>
<body>
<div class="mark"><span>Frencia</span></div>
<div class="strip"><i style="background:#86EFAC"></i><i style="background:#FF8A4C"></i><i style="background:#22C55E"></i><i style="background:#C2410C"></i></div>
</body>
</html>
