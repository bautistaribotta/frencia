<!-- @dsCard group="iOS App" viewport="460x900" name="Crear rutina — wizard" subtitle="Flujo de alta de rutina, un dato por pantalla (nombre · días)" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRENCIA · Crear rutina</title>
<script>/* tema antes del primer paint: evita el flash y el color varado */(function(){try{var t=localStorage.getItem('frencia-theme');document.documentElement.dataset.theme=(t==='light'||t==='dark')?t:'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; margin: 0; background-color: var(--stage-bg); }
  #root { min-height: 100%; display: grid; place-items: start center; padding: 28px; box-sizing: border-box; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script src="data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="theme-toggle.jsx"></script>
<script type="text/babel" src="CreateRoutineWizard.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const [open, setOpen] = React.useState(true);
  const [theme, setTheme] = useTheme();
  React.useEffect(() => {
    const id = setInterval(() => { window.lucide && lucide.createIcons(); }, 300);
    return () => clearInterval(id);
  }, []);

  return (
    <div className="stage">
    <IOSDevice key={theme} dark={theme === 'dark'} width={402} height={812}>
      <div style={{ position: 'relative', height: '100%', background: 'var(--bg-app)' }}>
        {open ? (
          <CreateRoutineWizard
            onExit={() => setOpen(false)}
            onFinish={() => setOpen(false)}
          />
        ) : (
          <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', padding: 24, textAlign: 'center' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14, alignItems: 'center' }}>
              <span style={{ font: 'var(--text-data-label)', letterSpacing: 'var(--ls-wider)', textTransform: 'uppercase', color: 'var(--text-tertiary)' }}>Wizard cerrado</span>
              <button onClick={() => setOpen(true)} style={{
                background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-md)',
                padding: '12px 18px', color: 'var(--text-primary)', font: 'var(--fw-semibold) 14px var(--font-sans)', cursor: 'pointer',
              }}>Reabrir flujo</button>
            </div>
          </div>
        )}
      </div>
    </IOSDevice>
    <ThemeToggle theme={theme} onChange={setTheme} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
