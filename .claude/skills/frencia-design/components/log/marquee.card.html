<!-- @dsCard group="Registro" viewport="700x300" name="MarqueeText — nombres largos en cinta" subtitle="Quieto si entra, cinta lenta si no entra; nunca salto de línea" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 24px; background: var(--bg-app); }
  .cap { font: 11px var(--font-mono); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; }
  .list { display: flex; flex-direction: column; gap: 8px; width: 295px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-xl); background: var(--surface-card); border: 1px solid var(--border-subtle); }
  .col { flex: 1; min-width: 0; }
  .name { font: var(--fw-semibold) 15px var(--font-sans); color: var(--text-primary); }
  .sum { font: var(--fw-medium) 13px var(--font-mono); color: var(--text-secondary); margin-top: 4px; }
</style>
</head>
<body>
<div class="cap">MarqueeText · ancho de 295 px</div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
// El bundle todavia no trae MarqueeText: se transpila desde la fuente.
fetch('MarqueeText.jsx').then(function (r) { return r.text(); }).then(function (src) {
  src = src.replace(/^import[^\n]*\n/gm, '').replace(/^export\s+/gm, '');
  var code = Babel.transform(src, { presets: ['react'] }).code;
  var MarqueeText = new Function('React', code + '\nreturn MarqueeText;')(React);
  var names = ['Press banca plano con barra', 'Jalón a una mano', 'Curl de bíceps con mancuernas en banco inclinado', 'Extensión de tríceps en polea con cuerda'];
  var h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'list' }, names.map(function (n) {
      return h('div', { key: n, className: 'row' },
        h('div', { className: 'col' },
          h(MarqueeText, { text: n, className: 'name' }),
          h('div', { className: 'sum' }, '3x10 · RIR 2 · 2 min')));
    })));
});
</script>
</body>
</html>
